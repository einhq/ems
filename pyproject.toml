[project]
name = "ems"
version = "0.1.0"
description = "EiN Media Service — media tools and models behind an HTTP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# The tool ops. The models' own stack (torch, transformers, onnxruntime, faster-whisper, nemo…)
# is installed by the Containerfile, not here: those pins are architecture-specific and the
# reasons for each are written beside the RUN lines.
tools = [
  "opencv-python-headless",
  "Pillow",
  "pi-heif",
  "rawpy",
  "pypdfium2",
  "python-docx",
  "odfpy",
]
test = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ems*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
