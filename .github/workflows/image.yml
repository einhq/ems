name: image

# EMS's image (Containerfile), published for the installer to pull: ghcr.io/einhq/ems:main is the
# newest commit on main, :sha-<commit> each one. Built on a runner without a graphics card, so
# nothing here runs `make gpu-check`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time; a push during it queues the newest commit only.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is about 26 GB unpacked, and the build keeps its layers twice, unpacked and
      # compressed for the push: more than the runner's root disk has free. Docker's data, and the
      # builder's with it, goes to the larger disk at /mnt, and the root disk sheds the toolchains
      # this job does not use.
      - name: Make room
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq '."data-root" = "/mnt/docker"' /etc/docker/daemon.json >daemon.json
          sudo mv daemon.json /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v7
        with:
          # The tags, for git describe.
          fetch-depth: 0
      - name: Stamp
        id: stamp
        # What the service's health reports as its build: the commit and its date.
        run: |
          echo "$(git describe --always --dirty) $(git log -1 --format=%cI)" >ems/BUILD
          echo "sha=$(git rev-parse --short=9 HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The cache is the published image itself (inline): the layers above an edit are reused with
      # their digests, so an installation's update pulls only the layers that changed. GitHub's own
      # cache holds 10 GB, too little for these.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ems:main
            ghcr.io/${{ github.repository_owner }}/ems:sha-${{ steps.stamp.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=EMS, the EiN Media Service: every media tool and model behind one HTTP API, run by compose from ein/deploy
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ems:main
          cache-to: type=inline
      - name: Room left
        if: always()
        run: df -h / /mnt
