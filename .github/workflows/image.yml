name: image

# EMS's image (Containerfile), published for the installer to pull: ghcr.io/einhq/ems:main is main
# as of the last build, :sha-<commit> each commit built. Built once a day when main has moved since
# (ein/core#835), and at once when run by hand. Built on a runner without a graphics card, so
# nothing here runs `make gpu-check`.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

# One build at a time; a run started during it waits, and only the newest waiting run is kept.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  # Whether to build: a scheduled run builds nothing when main's commit already has its image.
  check:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ems
        run: |
          sha=$(git rev-parse --short=9 HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$IMAGE:sha-$sha" >/dev/null 2>&1; then
            echo "$IMAGE:sha-$sha exists"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, for git describe.
          fetch-depth: 0
      - name: Stamp
        # What the service's health reports as its build: the commit and its date.
        run: echo "$(git describe --always --dirty) $(git log -1 --format=%cI)" >ems/BUILD
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The cache is the published image itself (inline): the layers above an edit are reused with
      # their digests, so an installation's update pulls only the layers that changed. GitHub's own
      # cache holds 10 GB, too little for these.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ems:main
            ghcr.io/${{ github.repository_owner }}/ems:sha-${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=EMS, the EiN Media Service: every media tool and model behind one HTTP API, run by compose from ein/deploy
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ems:main
          cache-to: type=inline
